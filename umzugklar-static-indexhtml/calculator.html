function icon(n,s=22){return `<svg class="icon" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[n]||''}</svg>`}

let locale=localStorage.getItem('umzugklar-locale')||'de'; if(!translations[locale])locale='de'; const t=k=>translations[locale][k]||translations.de[k]||k;
let step=1; let data={movingType:'apartment',area:45,distance:25,originFloor:1,destinationFloor:2,originElevator:true,destinationElevator:false,services:[],date:'',cityFrom:'',cityTo:''};
function calculateMove(){const base=pricing.base[data.movingType];const area=data.area*pricing.perSquareMeter;let distance=data.distance*pricing.perKm;if(data.distance>pricing.longDistanceThreshold)distance*=pricing.longDistanceMultiplier;const stairs=(data.originFloor+data.destinationFloor)*pricing.floorFee+(!data.originElevator&&data.originFloor>0?pricing.noElevatorFee:0)+(!data.destinationElevator&&data.destinationFloor>0?pricing.noElevatorFee:0);const extras=data.services.reduce((s,k)=>s+pricing.services[k].price,0);const net=Math.max(pricing.minimumOrder,Math.round(base+area+distance+stairs+extras));return{min:Math.round(net*.93/5)*5,max:Math.round(net*1.08/5)*5,breakdown:{base,area:Math.round(area),distance:Math.round(distance),stairs:Math.round(stairs),extras},id:`MOV-${new Date().getFullYear()}-${Math.random().toString(36).slice(2,8).toUpperCase()}`}}
function render(){const c=copy[locale]; document.documentElement.lang=locale; const types={apartment:'building',house:'truck',office:'layers',furniture:'sofa',other:'box'}; let content='';
if(step===1) content=`<span class="eyebrow">${c.step} 1 / 7</span><h2>${c.s1}</h2><p class="subcopy">${c.s1p}</p><div class="type-grid">${Object.keys(types).map(k=>`<button class="type-card ${data.movingType===k?'selected':''}" data-type="${k}">${icon(types[k],29)}<span>${c.types[k]}</span><i>${icon('check',13)}</i></button>`).join('')}</div>`;
if(step===2) content=`<span class="eyebrow">${c.step} 2 / 7</span><h2>${c.s2}</h2><p class="subcopy">${c.s2p}</p><div class="range-row"><input id="areaRange" type="range" min="10" max="200" step="5" value="${data.area}"><strong id="areaVal">${data.area} <small>m²</small></strong></div><div class="range-label"><span>${c.small}</span><span>${c.large}</span></div>`;
if(step===3) content=`<span class="eyebrow">${c.step} 3 / 7</span><h2>${c.s3}</h2><p class="subcopy">${c.s3p}</p><div class="route-grid"><label>${c.from}<input id="cityFrom" value="${data.cityFrom}" placeholder="${c.example1}"></label><label>${c.to}<input id="cityTo" value="${data.cityTo}" placeholder="${c.example2}"></label><label>${c.distance}<input id="dist" type="number" min="0" value="${data.distance}"><small>km</small></label></div>`;
if(step===4) content=`<span class="eyebrow">${c.step} 4 / 7</span><h2>${c.s4}</h2><div class="floor-grid">${[['origin',c.origin],['destination',c.destination]].map(([p,l])=>`<div class="floor-card"><h3>${l}</h3><label>${c.floor}<select id="${p}Floor">${Array.from({length:11},(_,n)=>`<option value="${n}" ${data[p+'Floor']===n?'selected':''}>${n===0?c.ground:n}</option>`).join('')}</select></label><button id="${p}Elevator" class="lift-choice ${data[p+'Elevator']?'active':''}">${c.elevator} <span>${data[p+'Elevator']?c.yes:c.no}</span></button></div>`).join('')}</div>`;
if(step===5) content=`<span class="eyebrow">${c.step} 5 / 7</span><h2>${c.s5}</h2><p class="subcopy">${c.s5p}</p><div class="service-list">${Object.keys(pricing.services).map(k=>`<button class="service-check ${data.services.includes(k)?'checked':''}" data-service="${k}"><i>${data.services.includes(k)?icon('check',15):''}</i><span>${pricing.services[k].label}</span><small>€ ${pricing.services[k].price}+</small></button>`).join('')}</div>`;
if(step===6) content=`<span class="eyebrow">${c.step} 6 / 7</span><h2>${c.s6}</h2><p class="subcopy">${c.s6p}</p><div class="date-choice"><label>${c.date}<input id="date" type="date" value="${data.date}"></label><button id="dateOpen" class="${!data.date?'selected-date':''}">${c.open}</button></div>`;
if(step===7){let r=calculateMove();content=`<span class="eyebrow">${c.estimate}</span><h2>${c.summary}</h2><div class="price-result"><div><small>${c.range}</small><strong>${r.min}–${r.max} €</strong><p>${c.id}: <b>${r.id}</b></p></div><dl><div><dt>${c.base}</dt><dd>${r.breakdown.base} €</dd></div><div><dt>${c.sizeRoute}</dt><dd>${r.breakdown.area+r.breakdown.distance} €</dd></div><div><dt>${c.floorsExtras}</dt><dd>${r.breakdown.stairs+r.breakdown.extras} €</dd></div></dl><p class="fineprint">${c.fine}</p><a class="button" href="#anfrage">${c.send} ${icon('arrow',17)}</a></div>`;}
 document.getElementById('app').innerHTML=`<header class="header"><div class="shell nav"><a class="brand" href="index.html"><span class="brand-mark">${icon('truck',20)}</span><span>umzug<span>klar</span></span></a><a href="index.html" class="text-link">← ${t('start')}</a></div></header><main class="calculator-page"><div class="shell breadcrumbs"><a href="index.html">${t('start')}</a><span>/</span><span>${t('costCalculator')}</span></div><section class="calculator-hero"><div class="shell"><p class="eyebrow">${t('minutes')}</p><h1>${t('calcHero1')}<br><em>${t('calcHero2')}</em></h1><p>${t('calcHeroLead')}</p></div></section><section class="shell calculator-section"><div class="full-calculator"><div class="stepper">${c.steps.map((l,i)=>`<div class="${i+1===step?'active':i+1<step?'done':''}"><i>${i+1<step?icon('check',13):i+1}</i><span>${l}</span></div>`).join('')}</div><div class="step-content">${content}</div><div class="step-nav"><button id="back" class="back" ${step===1?'disabled':''}>${c.back}</button>${step<7?`<button id="next" class="button">${c.next} ${icon('arrow',17)}</button>`:''}</div></div></section><section id="anfrage" class="consult-box"><div class="shell"><div><p class="eyebrow">${t('personal')}</p><h2>${t('advise')}</h2><p>${t('adviseText')}</p></div><div><a href="tel:+493012345678">+49 30 123 45 678</a><a href="https://wa.me/493012345678">${t('whatsapp')}</a></div></div></section></main>`;
 document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{data.movingType=b.dataset.type;render()}); let ar=document.getElementById('areaRange');if(ar)ar.oninput=()=>{data.area=+ar.value;document.getElementById('areaVal').innerHTML=data.area+' <small>m²</small>'}; ['cityFrom','cityTo','dist'].forEach(id=>{let e=document.getElementById(id);if(e)e.oninput=()=>{if(id==='dist')data.distance=+e.value;else data[id]=e.value}}); ['origin','destination'].forEach(p=>{let f=document.getElementById(p+'Floor'),e=document.getElementById(p+'Elevator');if(f)f.onchange=()=>data[p+'Floor']=+f.value;if(e)e.onclick=()=>{data[p+'Elevator']=!data[p+'Elevator'];render()}});document.querySelectorAll('[data-service]').forEach(b=>b.onclick=()=>{let k=b.dataset.service;data.services=data.services.includes(k)?data.services.filter(x=>x!==k):[...data.services,k];render()});let date=document.getElementById('date');if(date)date.onchange=()=>data.date=date.value;let dateOpen=document.getElementById('dateOpen');if(dateOpen)dateOpen.onclick=()=>{data.date='';render()};let back=document.getElementById('back');if(back)back.onclick=()=>{step--;render()};let next=document.getElementById('next');if(next)next.onclick=()=>{step++;render()};
}
