name: Демо-версия на GitHub Pages

# Публичная статическая версия сайта: расчёт цены считается в браузере,
# форма заявки открывает почтовый клиент. Для работы нужен включённый
# GitHub Pages (Settings → Pages → Source: GitHub Actions).

on:
  push:
    branches: ["main", "arena/01a0f3f6-repo"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Включение GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Статическая сборка
        run: npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Загрузка артефакта
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4
